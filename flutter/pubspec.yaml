name: v2raypro
description: "A modern, professional V2Ray/Xray client with Cloudflare IP scanner for Windows and Android"
publish_to: "none"
version: 1.4.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  ffi: ^2.1.2
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  file_picker: ^8.0.0
  url_launcher: ^6.2.6
  tray_manager: ^0.7.0
  window_manager: ^0.5.2
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bin/xray.exe
    - assets/fonts/tahoma.ttf
    - assets/app_icon.ico
    - assets/app_icon.png

  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/tahoma.ttf
